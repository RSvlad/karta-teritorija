name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # Type or test failures stop the workflow here, before anything is published.
      - run: npm run typecheck
      - run: npm test

      # `prebuild` runs data-pipeline/build-data.mjs (Sheet -> public/data/, git-ignored),
      # so the JSON goes straight into the Pages artifact and is never committed.
      # Outside pull requests the Sheet credentials are required: no demo data in a deploy.
      # Pull requests never receive the secrets and build with the demo seed.
      - run: npm run build
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ github.event_name != 'pull_request' && secrets.GOOGLE_SERVICE_ACCOUNT || '' }}
          SHEETS_CITIES: ${{ github.event_name != 'pull_request' && secrets.SHEETS_CITIES || '' }}
          PIPELINE_REQUIRED: ${{ github.event_name != 'pull_request' && '1' || '' }}

      # Optional custom domain: set the repository variable CUSTOM_DOMAIN.
      - name: Write CNAME
        if: ${{ vars.CUSTOM_DOMAIN != '' }}
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > dist/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
